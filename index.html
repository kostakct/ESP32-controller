<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <title>ESP32 eWeLink Controller</title>
    
    <!-- Nastavení pro běh na celou obrazovku bez adresního řádku -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ESP32" />

    <!-- Odkaz na manifest s tečkou ./ pro GitHub Pages -->
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body class="bg-[#eaf1f7] text-slate-800 antialiased">
    <div id="root"></div>

    <!-- Zde je registrace Service Workera: všimněte si tečky v './sw.js' -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker aktivován pro GitHub Pages:', reg.scope))
            .catch((err) => console.error('Chyba Service Workera:', err));
        });
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
