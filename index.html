<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ESP32 eWeLink Controller</title>
    <meta name="description" content="Mobilní rozhraní ve stylu aplikace eWeLink pro dálkovou správu 4 spínačů ESP32-S3 přes MQTT, s funkcemi časovače a prodlužovaného delay." />
    <meta property="og:title" content="ESP32 eWeLink Controller" />
    <meta property="og:description" content="Mobilní rozhraní ve stylu aplikace eWeLink pro dálkovou správu 4 spínačů ESP32-S3 přes MQTT, s funkcemi časovače a prodlužovaného delay." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ESP eWeLink" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#eaf1f7] text-slate-800 antialiased">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => { console.log('SW registered successfully.'); },
            (err) => { console.error('SW registration failed:', err); }
          );
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
